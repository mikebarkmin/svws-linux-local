# SVWS-Server + MariaDB for local testing with SchILD-NRW 3.
# Managed by ./svws – values come from .env (see .env.example).
services:
  mariadb:
    image: docker.io/library/mariadb:11
    container_name: svws-local-mariadb
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"      # SchILD-NRW 3 connects to the DB directly
    volumes:
      - ./data/mariadb:/var/lib/mysql:Z

  svws-server:
    image: docker.io/svwsnrw/svws-server:${SVWS_VERSION}
    container_name: svws-local-server
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file: .env
    environment:
      # Only true when ./svws asks for it: the import runs on every *new* container
      # and would overwrite the database.
      IMPORT_TEST_DATA: ${IMPORT_TEST_DATA:-false}
    ports:
      - "127.0.0.1:${SVWS_PORT:-8443}:8443"
    volumes:
      - ./data/svws:/opt/app/svws/conf:Z       # svwsconfig.json, keystore, logs
      - ./data/apps:/opt/app/svws/apps:Z       # SVWS-Tools web apps (/app/<name>/)
