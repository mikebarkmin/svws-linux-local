# Hyprland (hyprlang config, before the Lua config): hide the empty "SchILD-NRW 3" window.
# Delphi's TApplication window is 0x0 on Windows; under Wine/XWayland Hyprland
# shows it as a floating window with a default size → park it on a hidden workspace.
windowrule = workspace special:schild-hidden silent, match:class ^schild30\.exe$, match:title ^SchILD-NRW 3$
windowrule = no_initial_focus on, match:class ^schild30\.exe$, match:title ^SchILD-NRW 3$
